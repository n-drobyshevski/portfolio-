<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="A post in a Russian Telegram channel is translated by AI and appears in the paired English channel">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .06em; }
    .post, .line, .ticks, .dot, .pill, .wire { transform-box: fill-box; animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.22, 1, .36, 1); animation-fill-mode: both; }
    .ru { animation-name: ru; }
    .en { animation-name: en; }
    .dot { animation-name: dot; animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    .pill { animation-name: pill; transform-origin: center; }
    .wire { animation-name: wire; }
    .l1 { animation-name: l1; } .l2 { animation-name: l2; } .l3 { animation-name: l3; } .l4 { animation-name: l4; }
    .ticks { animation-name: ticks; }
    @keyframes ru   { 0%, 4% { opacity: 0; transform: translateY(24px); } 12%, 88% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
    @keyframes wire { 0%, 12% { opacity: .35; } 16%, 36% { opacity: 1; } 44%, 100% { opacity: .35; } }
    @keyframes dot  { 0%, 14% { opacity: 0; transform: translateX(0); } 16% { opacity: 1; transform: translateX(0); } 34% { opacity: 1; transform: translateX(124px); } 37%, 100% { opacity: 0; transform: translateX(124px); } }
    @keyframes pill { 0%, 16% { transform: scale(1); } 22% { transform: scale(1.12); } 28% { transform: scale(1); } 100% { transform: scale(1); } }
    @keyframes en   { 0%, 34% { opacity: 0; transform: translateY(24px); } 41%, 88% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
    @keyframes l1   { 0%, 40% { opacity: 0; } 44%, 100% { opacity: 1; } }
    @keyframes l2   { 0%, 44% { opacity: 0; } 48%, 100% { opacity: 1; } }
    @keyframes l3   { 0%, 48% { opacity: 0; } 52%, 100% { opacity: 1; } }
    @keyframes l4   { 0%, 52% { opacity: 0; } 56%, 100% { opacity: 1; } }
    @keyframes ticks { 0%, 58% { opacity: 0; } 62%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .dot { opacity: 0; } }
  </style>

  <rect width="1200" height="750" fill="#F4F7FB"/>
  <g transform="translate(0 95)">
  <g>
    <rect x="100" y="0" width="430" height="560" rx="22" fill="#FFFFFF" stroke="#DCE2EB" stroke-width="2"/>
    <circle cx="150" cy="54" r="26" fill="#C0CDE6"/>
    <text x="150" y="63" text-anchor="middle" font-size="24" font-weight="700" fill="#1D3C99">LF</text>
    <text x="192" y="48" font-size="26" font-weight="700" fill="#172033">Le Fournil</text>
    <text x="192" y="76" class="mono" font-size="17" fill="#46516A">CHANNEL · RU</text>
    <line x1="100" y1="106" x2="530" y2="106" stroke="#DCE2EB" stroke-width="2"/>
    <rect x="124" y="132" width="300" height="80" rx="16" fill="#EEF2F8"/>
    <rect x="146" y="154" width="230" height="12" rx="6" fill="#D3DBE8"/>
    <rect x="146" y="178" width="170" height="12" rx="6" fill="#D3DBE8"/>
    <g class="post ru">
      <rect x="124" y="236" width="382" height="232" rx="18" fill="#E5EBF3"/>
      <text x="146" y="288" font-size="25" fill="#172033">Сегодня открываем новую</text>
      <text x="146" y="324" font-size="25" fill="#172033">пекарню на улице Гамбетта.</text>
      <text x="146" y="360" font-size="25" fill="#172033">Первые 50 гостей получат</text>
      <text x="146" y="396" font-size="25" fill="#172033">круассан в подарок.</text>
      <text x="482" y="446" text-anchor="end" class="mono" font-size="17" fill="#46516A">09:41</text>
    </g>
  </g>
  <line class="wire" x1="530" y1="352" x2="670" y2="352" stroke="#2A52C4" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle class="dot" cx="538" cy="352" r="9" fill="#2A52C4"/>
  <g class="pill">
    <rect x="565" y="327" width="70" height="50" rx="25" fill="#2A52C4"/>
    <text x="600" y="360" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#FFFFFF">AI</text>
  </g>
  <g>
    <rect x="670" y="0" width="430" height="560" rx="22" fill="#FFFFFF" stroke="#DCE2EB" stroke-width="2"/>
    <circle cx="720" cy="54" r="26" fill="#C0CDE6"/>
    <text x="720" y="63" text-anchor="middle" font-size="24" font-weight="700" fill="#1D3C99">LF</text>
    <text x="762" y="48" font-size="26" font-weight="700" fill="#172033">Le Fournil</text>
    <text x="762" y="76" class="mono" font-size="17" fill="#46516A">CHANNEL · EN</text>
    <line x1="670" y1="106" x2="1100" y2="106" stroke="#DCE2EB" stroke-width="2"/>
    <rect x="694" y="132" width="300" height="80" rx="16" fill="#EEF2F8"/>
    <rect x="716" y="154" width="230" height="12" rx="6" fill="#D3DBE8"/>
    <rect x="716" y="178" width="170" height="12" rx="6" fill="#D3DBE8"/>
    <g class="post en">
      <rect x="694" y="236" width="382" height="232" rx="18" fill="#E5EBF3"/>
      <text class="line l1" x="716" y="288" font-size="25" fill="#172033">Today we open our new</text>
      <text class="line l2" x="716" y="324" font-size="25" fill="#172033">bakery on rue Gambetta.</text>
      <text class="line l3" x="716" y="360" font-size="25" fill="#172033">The first 50 guests get</text>
      <text class="line l4" x="716" y="396" font-size="25" fill="#172033">a free croissant.</text>
      <text class="ticks mono" x="1052" y="446" text-anchor="end" font-size="17" fill="#2A52C4">09:41 ✓✓</text>
    </g>
  </g>
  </g>
</svg>
